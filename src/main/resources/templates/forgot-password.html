<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Forgot Password – User Management</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;}
    html,body{margin:0;}
    body{
      font-family:'Plus Jakarta Sans',sans-serif; min-height:100vh;
      display:flex; align-items:center; justify-content:center; padding:24px;
      color:#1f2430;
      background:
        radial-gradient(at 8% 8%, rgba(139,124,240,.30) 0, transparent 42%),
        radial-gradient(at 92% 15%, rgba(232,164,196,.30) 0, transparent 45%),
        radial-gradient(at 50% 100%, rgba(187,192,186,.3) 0, transparent 50%),
        #f3f0fa;
    }

    .page-wrapper{ width:100%; max-width:380px; }
    .brand{ display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:22px; }
    .brand .mark{ width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,#6d5bd0,#c8537a); }
    .brand .wordmark{ font-size:15px; font-weight:800; }

    .container{
      padding:28px 26px; background:#fff; border-radius:18px;
      box-shadow:0 20px 50px rgba(80,60,110,.16); border:1px solid #efedf4;
    }

    h1{ text-align:center; margin:0 0 22px; font-size:19px; font-weight:800; letter-spacing:-.01em; }
    .form-group{ margin-bottom:14px; }
    label{ display:block; margin-bottom:6px; font-size:11px; font-weight:700; color:#9ca0ae; text-transform:uppercase; letter-spacing:.03em; }
    input{ width:100%; padding:10px 12px; box-sizing:border-box; border:1px solid #efedf4; border-radius:10px; font-family:inherit; font-size:13.5px; background:#fdfcff; color:#1f2430; }
    input:focus{ outline:none; border-color:#6d5bd0; }
    .btn{ width:100%; padding:12px; margin-top:6px; background:#4b3a5e; border:none; border-radius:10px; color:#fff; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; }
    .btn:hover{ background:#3d2f4d; }

    .alert{ padding:10px 12px; border-radius:10px; margin-top:10px; font-size:12.5px; }
    .alert-danger{ background:#f7e0e6; color:#c8537a; }
    .alert-success{ background:#d7f0e3; color:#2f9e6b; }

    .links{ text-align:center; margin-top:18px; display:flex; justify-content:center; gap:14px; }
    .links a{ color:#6d5bd0; text-decoration:none; font-size:12.5px; font-weight:600; }
    .links a:hover{ text-decoration:underline; }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="brand"><div class="mark"></div><div class="wordmark">UserMgmt</div></div>

    <!-- forgot-password card -->
    <div class="container">
      <h1>Forgot Password</h1>

      <form th:action="@{/forgot-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            required />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required />
        </div>

        <button type="submit" class="btn">Send reset link</button>
      </form>

      <div class="links">
        <a th:href="@{/login}">Back to login</a>
        <a th:href="@{/register}">Create an account</a>
      </div>
    </div>

    <!-- alerts below the card, same width -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

  </div>
</body>
</html>
