<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Dashboard – User Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{box-sizing:border-box;}
    html,body{margin:0;}
    body{
      font-family:'Plus Jakarta Sans',sans-serif; min-height:100vh; color:#1f2430;
      background:
        radial-gradient(at 8% 8%, rgba(139,124,240,.30) 0, transparent 42%),
        radial-gradient(at 92% 15%, rgba(232,164,196,.30) 0, transparent 45%),
        radial-gradient(at 50% 100%, rgba(187,192,186,.3) 0, transparent 50%),
        #f3f0fa;
    }

    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 28px; background:#fff; border-bottom:1px solid #efedf4;
    }
    .brand{ display:flex; align-items:center; gap:10px; }
    .brand .mark{ width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,#6d5bd0,#c8537a); }
    .brand .wordmark{ font-size:14.5px; font-weight:800; }
    .logout-btn{
      padding:8px 16px; background:#f2eff6; border:1px solid #efedf4; border-radius:9px;
      color:#4b3a5e; font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer;
    }
    .logout-btn:hover{ background:#e9e4f1; }

    .page{ max-width:640px; margin:0 auto; padding:36px 24px; }
    .page h2{ font-size:22px; font-weight:800; margin:0 0 2px; letter-spacing:-.01em; }
    .page .role-line{ color:#9ca0ae; font-size:12.5px; margin:0 0 22px; }

    .card{
      background:#fff; border-radius:16px; padding:22px 24px;
      box-shadow:0 14px 36px rgba(80,60,110,.12); border:1px solid #efedf4;
    }
    .card h4{ font-size:14px; font-weight:800; margin:0 0 18px; }

    .form-group{ margin-bottom:14px; }
    label{ display:block; margin-bottom:6px; font-size:11px; font-weight:700; color:#9ca0ae; text-transform:uppercase; letter-spacing:.03em; }
    input{ width:100%; padding:10px 12px; border:1px solid #efedf4; border-radius:10px; font-family:inherit; font-size:13.5px; background:#fdfcff; color:#1f2430; }
    input:focus{ outline:none; border-color:#6d5bd0; }

    .actions-row{ display:flex; justify-content:flex-end; margin-top:16px; }
    .btn-primary{
      padding:11px 22px; background:#4b3a5e; border:none; border-radius:10px;
      color:#fff; font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer;
    }
    .btn-primary:hover{ background:#3d2f4d; }

    .form-error{
      color:#c8537a; background:#fbf0f3; border:1px solid #f4dde4; border-radius:9px;
      padding:7px 11px; margin-top:8px; font-size:12px;
    }
    .form-success{
      color:#2f9e6b; background:#e9f7ef; border:1px solid #cfeedd; border-radius:9px;
      padding:11px 14px; margin-top:14px; font-size:13px;
    }
    .d-none{ display:none; }
  </style>
</head>
<body>
  <nav class="topbar">
    <div class="brand"><div class="mark"></div><div class="wordmark">UserMgmt</div></div>
    <form method="post" th:action="@{/logout}">
      <button type="submit" class="logout-btn">Log out</button>
    </form>
  </nav>

  <div class="page">
    <h2 th:text="'Welcome, ' + ${username} + '!'">Welcome!</h2>
    <p class="role-line">Your role: USER</p>

    <div class="card">
      <h4>Your Profile</h4>

      <form id="profileForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email"
                 id="email"
                 th:value="${email}"
                 required />
        </div>
        <div class="form-group">
          <label for="password">New Password</label>
          <input type="password"
                 id="password"
                 placeholder="Leave blank to keep unchanged"/>
          <div id="passwordError" class="form-error d-none"></div>
        </div>
        <div class="actions-row">
          <button type="submit" class="btn-primary">
            Save Changes
          </button>
        </div>
      </form>
    </div>

    <!-- messages BELOW the main card, same width, not extending the card -->
    <div id="profileSuccess" class="form-success d-none">
      Profile updated successfully.
    </div>
    <div id="profileError" class="form-error d-none">
      Failed to update profile.
    </div>
  </div>

  <script>
    const API = '';

    async function authFetch(path, opts = {}) {
      opts.credentials = 'include';
      opts.headers = { 'Content-Type': 'application/json' };
      const res = await fetch(API + path, opts);
      let data;
      try { data = await res.json(); } catch { data = {}; }
      if (!res.ok) {
        const errorMsg = data?.error || ('HTTP ' + res.status);
        throw new Error(errorMsg);
      }
      return data;
    }

    /**
     * Validates password against backend rules (ValidationPatterns.java)
     * @param {string} password - The password to validate
     * @returns {object} - { valid: boolean, message: string }
     */
    function validatePassword(password) {
      // Backend requirements from ValidationPatterns.PASSWORD_PATTERN:
      // - At least 8 characters
      // - At least one lowercase letter
      // - At least one uppercase letter
      // - At least one digit
      // - At least one special character

      if (password.length < 8) {
        return {
          valid: false,
          message: 'Password must be at least 8 characters long.'
        };
      }

      if (!/[a-z]/.test(password)) {
        return {
          valid: false,
          message: 'Password must contain at least one lowercase letter.'
        };
      }

      if (!/[A-Z]/.test(password)) {
        return {
          valid: false,
          message: 'Password must contain at least one uppercase letter.'
        };
      }

      if (!/\d/.test(password)) {
        return {
          valid: false,
          message: 'Password must contain at least one digit.'
        };
      }

      if (!/[@$!%*?&#^()_+\-=\[\]{};':"\\|,.<>/~`]/.test(password)) {
        return {
          valid: false,
          message: 'Password must contain at least one special character (!@#$%^&* etc.).'
        };
      }

      return { valid: true, message: '' };
    }

    function clearMessages() {
      document.getElementById('profileSuccess').classList.add('d-none');
      document.getElementById('profileError').classList.add('d-none');
      document.getElementById('passwordError').classList.add('d-none');
    }

    document.getElementById('profileForm').onsubmit = async e => {
      e.preventDefault();
      clearMessages();

      const email    = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const passwordError = document.getElementById('passwordError');
      const payload  = { email };

      // Validate password if provided (optional for profile update)
      if (password) {
        const passwordValidation = validatePassword(password);
        if (!passwordValidation.valid) {
          passwordError.textContent = passwordValidation.message;
          passwordError.classList.remove('d-none');
          return;
        }
        payload.password = password;
      }

      try {
        await authFetch('/users/me', {
          method: 'PUT',
          body: JSON.stringify(payload)
        });

        document.getElementById('password').value = '';
        const successBox = document.getElementById('profileSuccess');
        successBox.textContent = 'Profile updated successfully.';
        successBox.classList.remove('d-none');
      } catch (err) {
        const errorBox = document.getElementById('profileError');
        const msg = (err.message || '').toLowerCase();

        // Check if it's a password-related error
        if (msg.includes('password')) {
          const passwordError = document.getElementById('passwordError');
          passwordError.textContent = err.message;
          passwordError.classList.remove('d-none');
        } else {
          errorBox.textContent = 'Update failed: ' + (err.message || err);
          errorBox.classList.remove('d-none');
        }
      }
    };
  </script>
</body>
</html>
